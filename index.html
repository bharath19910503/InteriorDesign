<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Varshith Interior Solutions</title>
  <style>
    body {margin:0;padding:0;font-family:'Montserrat',sans-serif;}
    header {background:#b08d57;color:white;padding:15px;text-align:center;font-size:24px;font-weight:bold;}
    nav {background:#8c6a3d;padding:10px;text-align:center;}
    nav a {color:white;margin:0 15px;text-decoration:none;font-weight:bold;}
    nav a:hover{text-decoration:underline;}

    .gallery{display:flex;gap:20px;padding:20px;flex-wrap:wrap;justify-content:center;}
    .gallery-item{text-align:center;animation:slideInRight 1s ease;}
    .gallery-item img{
      width:220px;
      height:160px;
      object-fit:cover;
      border-radius:8px;
      border:2px solid #b08d57;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .controls { text-align:center; margin:20px; }
    .send-btn, .clear-btn {
      margin:5px;
      padding:10px 20px;
      background:#8c6a3d;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
    }
    .send-btn:hover, .clear-btn:hover { background:#b08d57; }

    #selected-count { font-weight:bold; margin:10px; }

    #preview-panel {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin:20px;
    }
    #preview-panel img {
      width:100px;
      height:70px;
      object-fit:cover;
      border:2px solid #b08d57;
      border-radius:5px;
    }
  </style>
</head>
<body>

<header>Varshith Interior Solutions</header>

<nav>
  <a href="#bedroom">Bedroom</a>
  <a href="#kitchen">Kitchen</a>
  <a href="#tv">TV Unit</a>
</nav>

<section class="gallery" id="bedroom"><div id="bedroom-gallery"></div></section>
<section class="gallery" id="kitchen" style="display:none;"><div id="kitchen-gallery"></div></section>
<section class="gallery" id="tv" style="display:none;"><div id="tv-gallery"></div></section>

<div class="controls">
  <span id="selected-count">0 images selected</span><br>
  <button class="send-btn" onclick="sendAllSelected()">Send All Selected Designs</button>
  <button class="clear-btn" onclick="clearSelections()">Clear All Selections</button>
</div>

<div id="preview-panel"></div>

<script>
const baseURL = "https://bharath19910503.github.io/InteriorDesign/images/";

async function loadGallery(section) {
  const container = document.getElementById(section + "-gallery");
  container.innerHTML = "<p>Loading...</p>";

  try {
    const response = await fetch(`https://api.github.com/repos/bharath19910503/InteriorDesign/contents/images/${section}`);
    const files = await response.json();

    container.innerHTML = "";

    if (Array.isArray(files) && files.length > 0) {
      files.forEach(file => {
        if (/\.(jpg|jpeg|png)$/i.test(file.name)) {
          let div = document.createElement("div");
          div.className = "gallery-item";
          div.innerHTML = `
            <img src="${baseURL}${section}/${file.name}" alt="${file.name}" loading="lazy">
            <label><input type="checkbox" class="select-design" value="${section}/${file.name}"> Select</label>
          `;
          container.appendChild(div);
        }
      });
    } else {
      container.innerHTML = "<p>No images found in this section.</p>";
    }
  } catch (error) {
    container.innerHTML = "<p>Error loading images. Please try again later.</p>";
    console.error("Gallery load error:", error);
  }
}

function showSection(section) {
  ["bedroom","kitchen","tv"].forEach(s => {
    document.getElementById(s).style.display = (s === section) ? "block" : "none";
  });
  loadGallery(section);
}

document.querySelectorAll("nav a").forEach(link => {
  link.addEventListener("click", e => {
    const section = e.target.getAttribute("href").substring(1);
    showSection(section);
  });
});

document.addEventListener("change", e => {
  if (e.target.classList.contains("select-design")) {
    updateCounterAndPreview();
  }
});

function updateCounterAndPreview() {
  const checkboxes = document.querySelectorAll(".select-design:checked");
  document.getElementById("selected-count").textContent = `${checkboxes.length} images selected`;

  const preview = document.getElementById("preview-panel");
  preview.innerHTML = "";
  checkboxes.forEach(cb => {
    let img = document.createElement("img");
    img.src = baseURL + cb.value;
    preview.appendChild(img);
  });
}

// ✅ WhatsApp send function (working)
function sendAllSelected() {
  const checkboxes = document.querySelectorAll(".select-design:checked");
  if (checkboxes.length === 0) {
    alert("Please select at least one image.");
    return;
  }
  const selected = Array.from(checkboxes).map(cb => baseURL + cb.value);
  const phone = "919916511599"; // your WhatsApp number in international format
  const message = "Selected designs:\n" + selected.join("\n");
  const url = "https://api.whatsapp.com/send?phone=" + phone + "&text=" + encodeURIComponent(message);
  window.open(url, "_blank");
}

function clearSelections() {
  document.querySelectorAll(".select-design").forEach(cb => cb.checked = false);
  updateCounterAndPreview();
}

// Default load
showSection("bedroom");
</script>
</body>
</html>
