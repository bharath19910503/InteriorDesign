<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Varshith Interior Solutions</title>
  <style>
    body {margin:0;padding:0;font-family:'Montserrat',sans-serif;}
    header {background:#b08d57;color:white;padding:15px;text-align:center;font-size:24px;font-weight:bold;}
    nav {background:#8c6a3d;padding:10px;text-align:center;}
    nav a {color:white;margin:0 15px;text-decoration:none;font-weight:bold;}
    nav a.active {text-decoration:underline; color:#ffd700;}
    nav a:hover{text-decoration:underline;}

    .gallery-container {position: relative; display:none;}
    .gallery {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 20px;
      padding: 20px;
      scroll-behavior: smooth;
    }
    .gallery-item {flex: 0 0 auto; scroll-snap-align: center;}
    .gallery-item img {width:300px;border-radius:8px;border:2px solid #b08d57;}

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #8c6a3d;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
      opacity: 0.7;
    }
    .arrow:hover {opacity: 1;}
    .arrow.left {left: 10px;}
    .arrow.right {right: 10px;}

    #send-whatsapp {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    #send-whatsapp:hover {background: #128C7E;}

    #clear-selection {
      display: none;
      position: fixed;
      bottom: 70px;
      right: 20px;
      padding: 10px 18px;
      background: #b08d57;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      z-index: 999;
    }
    #clear-selection:hover {background: #8c6a3d;}
  </style>
</head>
<body>

<header>Varshith Interior Solutions</header>

<nav>
  <a href="#bedroom" class="active">Bedroom</a>
  <a href="#kitchen">Kitchen</a>
  <a href="#tv">TV Unit</a>
</nav>

<section class="gallery-container" id="bedroom">
  <button class="arrow left" onclick="scrollGallery('bedroom-gallery', -1)">&#10094;</button>
  <div class="gallery" id="bedroom-gallery"></div>
  <button class="arrow right" onclick="scrollGallery('bedroom-gallery', 1)">&#10095;</button>
</section>

<section class="gallery-container" id="kitchen">
  <button class="arrow left" onclick="scrollGallery('kitchen-gallery', -1)">&#10094;</button>
  <div class="gallery" id="kitchen-gallery"></div>
  <button class="arrow right" onclick="scrollGallery('kitchen-gallery', 1)">&#10095;</button>
</section>

<section class="gallery-container" id="tv">
  <button class="arrow left" onclick="scrollGallery('tv-gallery', -1)">&#10094;</button>
  <div class="gallery" id="tv-gallery"></div>
  <button class="arrow right" onclick="scrollGallery('tv-gallery', 1)">&#10095;</button>
</section>

<button id="clear-selection">Clear Selection</button>
<button id="send-whatsapp">Send Selected to WhatsApp</button>

<script>
const baseURL = "https://bharath19910503.github.io/InteriorDesign/images/";

const imageList = {
  bedroom: ["bed1.jpg","bed2.jpg","bed3.jpg"],
  kitchen: ["kitchen1.jpg","kitchen2.jpg","kitchen3.jpg"],
  tv: ["tv1.jpg","tv2.jpg","tv3.jpg"]
};

function loadGallery(section) {
  ["bedroom","kitchen","tv"].forEach(s => {
    document.getElementById(s).style.display = "none";
    document.querySelector(`nav a[href="#${s}"]`).classList.remove("active");
  });

  document.getElementById(section).style.display = "block";
  document.querySelector(`nav a[href="#${section}"]`).classList.add("active");

  const container = document.getElementById(section + "-gallery");
  container.innerHTML = "";

  imageList[section].forEach(file => {
    const imgUrl = baseURL + section + "/" + file;
    let div = document.createElement("div");
    div.className = "gallery-item";
    div.innerHTML = `
      <img src="${imgUrl}" alt="${file}">
      <label><input type="checkbox" class="select-design" value="${section}/${file}"> Select</label>
    `;
    container.appendChild(div);
  });
}

function scrollGallery(id, direction) {
  const container = document.getElementById(id);
  const scrollAmount = 320;
  container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
}

document.addEventListener("change", e => {
  if (e.target.classList.contains("select-design")) {
    const selected = document.querySelectorAll(".select-design:checked");
    const whatsappBtn = document.getElementById("send-whatsapp");
    const clearBtn = document.getElementById("clear-selection");

    if (selected.length > 0) {
      whatsappBtn.style.display = "block";
      whatsappBtn.textContent = `Send ${selected.length} Selected to WhatsApp`;
      clearBtn.style.display = "block";
    } else {
      whatsappBtn.style.display = "none";
      clearBtn.style.display = "none";
    }
  }
});

document.getElementById("clear-selection").addEventListener("click", () => {
  document.querySelectorAll(".select-design:checked").forEach(cb => cb.checked = false);
  document.getElementById("send-whatsapp").style.display = "none";
  document.getElementById("clear-selection").style.display = "none";
});

document.getElementById("send-whatsapp").addEventListener("click", () => {
  const selected = Array.from(document.querySelectorAll(".select-design:checked"))
    .map(cb => baseURL + cb.value);

  if (selected.length === 0) return;

  const message = "Selected designs:\n" + selected.join("\n");
  const whatsappUrl = "https://wa.me/?text=" + encodeURIComponent(message);
  window.open(whatsappUrl, "_blank");
});

// Load default gallery
loadGallery("bedroom");
</script>
</body>
</html>
