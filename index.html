<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Varshith Interior Solutions</title>
  <style>
    body {margin:0;padding:0;font-family:'Montserrat',sans-serif;}
    header {background:#b08d57;color:white;padding:15px;text-align:center;font-size:24px;font-weight:bold;}
    nav {background:#8c6a3d;padding:10px;text-align:center;}
    nav a {color:white;margin:0 15px;text-decoration:none;font-weight:bold;}
    nav a.active {text-decoration:underline; color:#ffd700;}
    nav a:hover{text-decoration:underline;}

    .gallery-container {position: relative; display:none;}
    .gallery {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 20px;
      padding: 20px;
      scroll-behavior: smooth;
    }
    .gallery-item {flex: 0 0 auto; scroll-snap-align: center;}
    .gallery-item img {width:300px;border-radius:8px;border:2px solid #b08d57;}

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #8c6a3d;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
      opacity: 0.7;
    }
    .arrow:hover {opacity: 1;}
    .arrow.left {left: 10px;}
    .arrow.right {right: 10px;}

    /* WhatsApp button */
    #send-whatsapp {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 12px 20px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      z-index: 1000;
    }
    #send-whatsapp:hover {background: #128C7E;}

    /* Clear Selection button */
    #clear-selection {
      display: none;
      position: fixed;
      bottom: 70px; /* above WhatsApp button */
      right: 20px;
      padding: 10px 18px;
      background: #b08d57;
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      z-index: 999;
    }
    #clear-selection:hover {background: #8c6a3d;}
  </style>
</head>
<body>

<header>Varshith Interior Solutions</header>

<nav>
  <a href="#bedroom" class="active">Bedroom</a>
  <a href="#kitchen">Kitchen</a>
  <a href="#tv">TV Unit</a>
</nav>

<section class="gallery-container" id="bedroom">
  <button class="arrow left" onclick="scrollGallery('bedroom-gallery', -1)">&#10094;</button>
  <div class="gallery" id="bedroom-gallery"></div>
  <button class="arrow right" onclick="scrollGallery('bedroom-gallery', 1)">&#10095;</button>
</section>

<section class="gallery-container" id="kitchen">
  <button class="arrow left" onclick="scrollGallery('kitchen-gallery', -1)">&#10094;</button>
  <div class="gallery" id="kitchen-gallery"></div>
  <button class="arrow right" onclick="scrollGallery('kitchen-gallery', 1)">&#10095;</button>
</section>

<section class="gallery-container" id="tv">
  <button class="arrow left" onclick="scrollGallery('tv-gallery', -1)">&#10094;</button>
  <div class="gallery" id="tv-gallery"></div>
  <button class="arrow right" onclick="scrollGallery('tv-gallery', 1)">&#10095;</button>
</section>

<!-- Action buttons -->
<button id="clear-selection">Clear Selection</button>
<button id="send-whatsapp">Send Selected to WhatsApp</button>

<script>
const baseURL = "https://bharath19910503.github.io/InteriorDesign/images/";

// ✅ Cache for watermark results
const watermarkCache = {};

function hasWatermark(imgUrl) {
  return new Promise(resolve => {
    if (watermarkCache[imgUrl] !== undefined) {
      resolve(watermarkCache[imgUrl]);
      return;
    }

    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = img.width;
      canvas.height = img.height;
      ctx.drawImage(img, 0, 0);

      const regionWidth = Math.floor(img.width * 0.2);
      const regionHeight = Math.floor(img.height * 0.2);

      // Bottom-right
      const bottomRight = ctx.getImageData(
        img.width - regionWidth,
        img.height - regionHeight,
        regionWidth,
        regionHeight
      ).data;

      // Top-left
      const topLeft = ctx.getImageData(
        0,
        0,
        regionWidth,
        regionHeight
      ).data;

      function containsTransparent(data) {
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] < 200) return true;
        }
        return false;
      }

      const watermarkFound = containsTransparent(bottomRight) || containsTransparent(topLeft);
      watermarkCache[imgUrl] = watermarkFound;
      resolve(watermarkFound);
    };
    img.src = imgUrl;
  });
}

async function loadGallery(section) {
  ["bedroom","kitchen","tv"].forEach(s => {
    document.getElementById(s).style.display = "none";
    document.querySelector(`nav a[href="#${s}"]`).classList.remove("active");
  });

  document.getElementById(section).style.display = "block";
  document.querySelector(`nav a[href="#${section}"]`).classList.add("active");

  const container = document.getElementById(section + "-gallery");
  container.innerHTML = "";

  const response = await fetch(`https://api.github.com/repos/bharath19910503/InteriorDesign/contents/images/${section}`);
  const files = await response.json();

  for (const file of files) {
    if (file.name.toLowerCase().endsWith(".jpg")) {
      const imgUrl = baseURL + section + "/" + file.name;
      const watermark = await hasWatermark(imgUrl);

      if (!watermark) {
        let div = document.createElement("div");
        div.className = "gallery-item";
        div.innerHTML = `
          <img src="${imgUrl}" alt="${file.name}">
          <label><input type="checkbox" class="select-design" value="${section}/${file.name}"> Select</label>
        `;
        container.appendChild(div);
      } else {
        console.log("Skipped watermarked image:", file.name);
      }
    }
  }
}

function scrollGallery(id, direction) {
  const container = document.getElementById(id);
  const scrollAmount = 320;
  container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
}

// Toggle buttons when checkboxes change
document.addEventListener("change", e => {
  if (e.target.classList.contains("select-design")) {
    const selected = document.querySelectorAll(".select-design:checked");
    const whatsappBtn = document.getElementById("send-whatsapp");
    const clearBtn = document.getElementById("clear-selection");

    if (selected.length > 0) {
      whatsappBtn.style.display = "block";
      whatsappBtn.textContent = `Send ${selected.length} Selected to WhatsApp`;
      clearBtn.style.display = "block";
    } else {
      whatsappBtn.style.display = "none";
      clearBtn.style.display = "none";
    }
  }
});

// Clear selection button
document.getElementById("clear-selection").addEventListener("click", () => {
  document.querySelectorAll(".select-design:checked").forEach(cb => cb.checked = false);
  document.getElementById("send-whatsapp").style.display = "none";
  document.getElementById("clear-selection").style.display = "none";
});

// WhatsApp button

  const selected = Array.from(document.querySelectorAll(".select-design:checked"))
    .map(cb => baseURL + cb.value);

  if (selected.length === 0) return;

  const message = "Selected designs:\n" + selected.join
