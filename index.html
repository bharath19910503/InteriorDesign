<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Varshith Interior Solutions</title>
  <style>
    body {margin:0;padding:0;font-family:'Montserrat',sans-serif;}
    header {background:#b08d57;color:white;padding:15px;text-align:center;font-size:24px;font-weight:bold;}
    nav {background:#8c6a3d;padding:10px;text-align:center;}
    nav a {color:white;margin:0 15px;text-decoration:none;font-weight:bold;}
    nav a:hover{text-decoration:underline;}

    .gallery{display:flex;gap:20px;padding:20px;flex-wrap:wrap;justify-content:center;}
    .gallery-item{text-align:center;animation:slideInRight 1s ease;}
    .gallery-item img{
      width:220px;
      height:160px;
      object-fit:cover;
      border-radius:8px;
      border:2px solid #b08d57;
    }

    @keyframes slideInRight {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .controls { text-align:center; margin:20px; }
    .send-btn, .clear-btn {
      margin:5px;
      padding:10px 20px;
      background:#8c6a3d;
      color:white;
      border:none;
      border-radius:5px;
      cursor:pointer;
      font-weight:bold;
    }
    .send-btn:hover, .clear-btn:hover { background:#b08d57; }

    #selected-count { font-weight:bold; margin:10px; }

    #preview-panel {
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin:20px;
    }
    #preview-panel img {
      width:100px;
      height:70px;
      object-fit:cover;
      border:2px solid #b08d57;
      border-radius:5px;
    }
  </style>
</head>
<body>

<header>Varshith Interior Solutions</header>

<nav>
  <a href="#bedroom">Bedroom</a>
  <a href="#kitchen">Kitchen</a>
  <a href="#tv">TV Unit</a>
</nav>

<section class="gallery" id="bedroom"><div id="bedroom-gallery"></div></section>
<section class="gallery" id="kitchen" style="display:none;"><div id="kitchen-gallery"></div></section>
<section class="gallery" id="tv" style="display:none;"><div id="tv-gallery"></div></section>

<div class="controls">
  <span id="selected-count">0 images selected</span><br>
  <button class="send-btn" onclick="sendAllSelected()">Send All Selected Designs</button>
  <button class="clear-btn" onclick="clearSelections()">Clear All Selections</button>
</div>

<div id="preview-panel"></div>

<script>
const baseURL = "https://bharath19910503.github.io/InteriorDesign/images/";

async function loadGallery(section) {
  const container = document.getElementById(section + "-gallery");
  container.innerHTML = "<p>Loading...</p>";

  try {
    const response = await fetch(`https://api.github.com/repos/bharath19910503/InteriorDesign/contents/images/${section}`);
    const files = await response.json();

    container.innerHTML = "";

    if (Array.isArray(files) && files.length > 0) {
      files.forEach(file => {
        if (/\.(jpg|jpeg|png)$/i.test(file.name)) {
          let div = document.createElement("div");
          div.className = "gallery-item";
          div.innerHTML = `
            <img src="${baseURL}${section}/${file.name}" alt="${file.name}" loading="lazy">
            <label><input type="checkbox" class="select-design" value="${section}/${file.name}"> Select</label>
          `;
          container.appendChild(div);
        }
      });
    } else {
      container.innerHTML = "<p>No images found in this section.</p>";
    }
  } catch (error) {
    container.innerHTML = "<p>Error loading images. Please try again later.</p>";
    console.error("Gallery load error:", error);
  }
}

function showSection(section) {
  ["bedroom","kitchen","tv"].forEach(s => {
    document.getElementById(s).style.display = (s === section) ? "block" : "none";
  });
  loadGallery(section);
}

document.querySelectorAll("nav a").forEach(link => {
  link.addEventListener("click", e => {
    const section = e.target.getAttribute("href").substring(1);
    showSection(section);
  });
});

document.addEventListener("change", e => {
  if (e.target.classList.contains("select-design")) {
    updateCounterAndPreview();
  }
});

function updateCounterAndPreview() {
  const checkboxes = document.querySelectorAll(".select-design:checked");
  document.getElementById("selected-count").textContent = `${checkboxes.length} images selected`;

  const preview = document.getElementById("preview-panel");
  preview.innerHTML = "";
  checkboxes.forEach(cb => {
    let img = document.createElement("img");
    img.src = baseURL + cb.value;
    preview.appendChild(img);
  });
}

async function fetchImagesAsFiles(urls) {
  const files = [];
  for (let i = 0; i < urls.length; i++) {
    try {
      const res = await fetch(urls[i]);
      const blob = await res.blob();
      const ext = (blob.type && blob.type.split('/')[1]) || 'jpg';
      const file = new File([blob], `design-${i + 1}.${ext}`, { type: blob.type || 'image/jpeg' });
      files.push(file);
    } catch (err) {
      console.warn('Could not fetch image for sharing:', urls[i], err);
    }
  }
  return files;
}

function buildWhatsAppLink(selectedUrls) {
  const phone = "919916511599";
  const message = "Selected designs:\n" + selectedUrls.join("\n");
  const encoded = encodeURIComponent(message);
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  return isMobile
    ? `https://wa.me/${phone}?text=${encoded}`
    : `https://web.whatsapp.com/send?phone=${phone}&text=${encoded}`;
}

async function sendAllSelected() {
  const checkboxes = document.querySelectorAll(".select-design:checked");
  if (checkboxes.length === 0) {
    alert("Please select at least one image.");
    return;
  }
  const selectedUrls = Array.from(checkboxes).map(cb => baseURL + cb.value);
  const waLink = buildWhatsAppLink(selectedUrls);

  console.log('Selected URLs:', selectedUrls);
  console.log('WhatsApp link:', waLink);

  // 1) Try Web Share API with files (best experience on mobile browsers that support it)
  if (navigator.canShare && navigator.share) {
    try {
      const files = await fetchImagesAsFiles(selectedUrls);
      if (files.length > 0 && navigator.canShare({ files })) {
        await navigator.share({ files, text: 'Selected designs', title: 'Varshith Interior Designs' });
        return; // shared successfully
      }
    } catch (err) {
      console.warn('Web Share API failed or not supported for files:', err);
      // fall through to link-based approach
    }
  }

  // 2) Fallback: try programmatic anchor click (works better with some popup blockers)
  try {
    const a = document.createElement('a');
    a.href = waLink;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    document.body.appendChild(a);
    a.click();
    a.remove();
    return;
  } catch (err) {
    console.warn('Anchor click failed, falling back to window.open:', err);
  }

  // 3) Final fallback: window.open or navigate
  try {
    const win = window.open(waLink, '_blank');
    if (!win) window.location.href = waLink;
  } catch (err) {
    console.error('Final WhatsApp open failed:', err);
    window.location.href = waLink;
  }
}

function clearSelections() {
  document.querySelectorAll(".select-design").forEach(cb => cb.checked = false);
  updateCounterAndPreview();
}

// Default load
showSection("bedroom");
</script>
</body>
</html>
