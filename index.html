<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Varshith Interior Solutions</title>
  <style>
    body {margin:0;padding:0;font-family:'Montserrat',sans-serif;}
    header {background:#b08d57;color:white;padding:15px;text-align:center;font-size:24px;font-weight:bold;}
    nav {background:#8c6a3d;padding:10px;text-align:center;}
    nav a {color:white;margin:0 15px;text-decoration:none;font-weight:bold;}
    nav a.active {text-decoration:underline; color:#ffd700;} /* highlight active */
    nav a:hover{text-decoration:underline;}

    .gallery-container {position: relative; display:none;} /* hidden until selected */
    .gallery {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      gap: 20px;
      padding: 20px;
      scroll-behavior: smooth;
    }
    .gallery-item {flex: 0 0 auto; scroll-snap-align: center;}
    .gallery-item img {width:300px;border-radius:8px;border:2px solid #b08d57;}

    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: #8c6a3d;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
      font-size: 18px;
      border-radius: 50%;
      opacity: 0.7;
    }
    .arrow:hover {opacity: 1;}
    .arrow.left {left: 10px;}
    .arrow.right {right: 10px;}
  </style>
</head>
<body>

<header>Varshith Interior Solutions</header>

<nav>
  <a href="#bedroom" class="active">Bedroom</a>
  <a href="#kitchen">Kitchen</a>
  <a href="#tv">TV Unit</a>
</nav>

<section class="gallery-container" id="bedroom">
  <button class="arrow left" onclick="scrollGallery('bedroom-gallery', -1)">&#10094;</button>
  <div class="gallery" id="bedroom-gallery"></div>
  <button class="arrow right" onclick="scrollGallery('bedroom-gallery', 1)">&#10095;</button>
</section>

<section class="gallery-container" id="kitchen">
  <button class="arrow left" onclick="scrollGallery('kitchen-gallery', -1)">&#10094;</button>
  <div class="gallery" id="kitchen-gallery"></div>
  <button class="arrow right" onclick="scrollGallery('kitchen-gallery', 1)">&#10095;</button>
</section>

<section class="gallery-container" id="tv">
  <button class="arrow left" onclick="scrollGallery('tv-gallery', -1)">&#10094;</button>
  <div class="gallery" id="tv-gallery"></div>
  <button class="arrow right" onclick="scrollGallery('tv-gallery', 1)">&#10095;</button>
</section>

<script>
const baseURL = "https://bharath19910503.github.io/InteriorDesign/images/";

async function loadGallery(section) {
  // Hide all galleries
  ["bedroom","kitchen","tv"].forEach(s => {
    document.getElementById(s).style.display = "none";
    document.querySelector(`nav a[href="#${s}"]`).classList.remove("active");
  });

  // Show selected gallery
  document.getElementById(section).style.display = "block";
  document.querySelector(`nav a[href="#${section}"]`).classList.add("active");

  const container = document.getElementById(section + "-gallery");
  container.innerHTML = "";

  const response = await fetch(`https://api.github.com/repos/bharath19910503/InteriorDesign/contents/images/${section}`);
  const files = await response.json();

  files.forEach(file => {
    if (file.name.toLowerCase().endsWith(".jpg")) {
      let div = document.createElement("div");
      div.className = "gallery-item";
      div.innerHTML = `
        <img src="${baseURL}${section}/${file.name}" alt="${file.name}">
        <label><input type="checkbox" class="select-design" value="${section}/${file.name}"> Select</label>
      `;
      container.appendChild(div);
    }
  });
}

function scrollGallery(id, direction) {
  const container = document.getElementById(id);
  const scrollAmount = 320; // width of image + gap
  container.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
}

// Nav click events
document.querySelectorAll("nav a").forEach(link => {
  link.addEventListener("click", e => {
    e.preventDefault();
    const section = e.target.getAttribute("href").substring(1);
    loadGallery(section);
  });
});

// Load Bedroom by default
loadGallery("bedroom");
</script>
</body>
</html>
